# Named so the stack cannot be mistaken for another project's. Compose otherwise derives the name
# from this directory, which is `docker/` in more than one checkout on a developer's machine, and two
# of them then share containers.
name: lyna

services:
  app:
    image: ghcr.io/rainbowdashlabs/lyna-backend:latest
    networks:
      - lyna
    depends_on:
      - postgres
    volumes:
      - ../config/:/app/config/
    profiles:
      - prod
  app_dev:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    networks:
      - lyna
    depends_on:
      - postgres
    volumes:
      - ../config/:/app/config/
    profiles:
      - dev
    ports:
      - 8888:8888
  frontend:
    image: ghcr.io/rainbowdashlabs/lyna-frontend:latest
    networks:
      - lyna
    depends_on:
      - app
    environment:
      NUXT_BACKEND_URL: http://app:8888
    profiles:
      - prod
  frontend_dev:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    networks:
      - lyna
    depends_on:
      - app_dev
    environment:
      NUXT_BACKEND_URL: http://app_dev:8888
    profiles:
      - dev
    ports:
      - 3000:3000
  app_e2e:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    networks:
      - lyna
    depends_on:
      - postgres_e2e
    volumes:
      - ./config/:/app/config/
    environment:
      JAVA_OPTS: "-Dbot.config=config/config.e2e.json -Dlog4j.configurationFile=config/log4j2.xml"
    profiles:
      - e2e
    ports:
      - 8890:8888
  seed_e2e:
    image: postgres:17
    networks:
      - lyna
    depends_on:
      - app_e2e
    volumes:
      - ./config/:/seed/
    profiles:
      - e2e
    # The backend migrates the schema on startup, so the seed waits for a table it creates rather
    # than for the container, which is up long before the tables are.
    entrypoint:
      - sh
      - -c
      - |
        until psql -h postgres_e2e -U user -d lyna -c 'SELECT 1 FROM public.product LIMIT 1' >/dev/null 2>&1; do
          sleep 2
        done
        psql -h postgres_e2e -U user -d lyna -v ON_ERROR_STOP=1 -f /seed/seed.e2e.sql
    environment:
      PGPASSWORD: "pw"
    restart: "no"
  postgres_e2e:
    networks:
      - lyna
    image: postgres:17
    profiles:
      - e2e
    environment:
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "pw"
      POSTGRES_DB: "lyna"
  postgres:
    networks:
      - lyna
    image: postgres:latest
    profiles:
      - dev
      - prod
    expose:
      - 5432
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgres/data
    environment:
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "pw"
      POSTGRES_DB: "lyna"

networks:
  lyna:
    name: lyna
    external: false

volumes:
  db_data:
