version: '3.7'

services:
  app:
    image: ghcr.io/rainbowdashlabs/lyna-backend:latest
    networks:
      - lyna
    depends_on:
      - postgres
    volumes:
      - ../config/:/app/config/
    profiles:
      - prod
  app_dev:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    networks:
      - lyna
    depends_on:
      - postgres
    volumes:
      - ../config/:/app/config/
    profiles:
      - dev
    ports:
      - 8888:8888
  frontend:
    image: ghcr.io/rainbowdashlabs/lyna-frontend:latest
    networks:
      - lyna
    depends_on:
      - app
    environment:
      NUXT_BACKEND_URL: http://app:8888
    profiles:
      - prod
  frontend_dev:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    networks:
      - lyna
    depends_on:
      - app_dev
    environment:
      NUXT_BACKEND_URL: http://app_dev:8888
    profiles:
      - dev
    ports:
      - 3000:3000
  postgres:
    networks:
      - lyna
    image: postgres:latest
    expose:
      - 5432
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgres/data
    environment:
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "pw"
      POSTGRES_DB: "lyna"

networks:
  lyna:
    name: lyna
    external: false

volumes:
  db_data:
